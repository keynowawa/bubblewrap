<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" fill="none">
  <style>
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes scanline { 0%{transform:translateY(-140px)} 100%{transform:translateY(140px)} }
    @keyframes fadeIn1 { 0%,20%{opacity:0} 25%{opacity:1} }
    @keyframes fadeIn2 { 0%,45%{opacity:0} 50%{opacity:1} }
    @keyframes fadeIn3 { 0%,65%{opacity:0} 70%{opacity:1} }
    @keyframes glitch {
      0%,92%,100%{transform:translate(0)} 
      93%{transform:translate(-2px,1px)} 
      94%{transform:translate(2px,-1px)} 
      95%{transform:translate(-1px,-1px)}
      96%{transform:translate(1px,2px)}
    }
    .bg { fill: #0d1117; }
    .dots circle:nth-child(1) { fill: #ff5f57; }
    .dots circle:nth-child(2) { fill: #febc2e; }
    .dots circle:nth-child(3) { fill: #28c840; }
    .title-bar { fill: #8b949e; font-family: 'SF Mono','Fira Code',monospace; font-size: 11px; }
    .prompt { fill: #7ee787; font-family: 'SF Mono','Fira Code',monospace; font-size: 13px; }
    .cmd { fill: #f0f6fc; font-family: 'SF Mono','Fira Code',monospace; font-size: 13px; font-weight: bold; }
    .flag { fill: #79c0ff; font-family: 'SF Mono','Fira Code',monospace; font-size: 13px; }
    .out { fill: #8b949e; font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
    .highlight { fill: #58a6ff; font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
    .cursor { fill: #58a6ff; animation: blink 1s step-end infinite; }
    .scanline { fill: url(#scanGrad); animation: scanline 4s linear infinite; opacity: 0.06; }
    .glitch { animation: glitch 8s ease-in-out infinite; }
    .l1 { animation: fadeIn1 3s ease forwards; }
    .l2 { animation: fadeIn2 3s ease forwards; }
    .l3 { animation: fadeIn3 3s ease forwards; }
    .border { stroke: #30363d; stroke-width: 1; fill: none; rx: 10; }
  </style>
  
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="termClip"><rect width="800" height="140" rx="10"/></clipPath>
  </defs>
  
  <rect class="bg" width="800" height="140" rx="10"/>
  <rect class="border" x="0.5" y="0.5" width="799" height="139"/>
  
  <!-- Title bar -->
  <line x1="0" y1="30" x2="800" y2="30" stroke="#30363d" stroke-width="0.5"/>
  <g class="dots" transform="translate(18, 15)">
    <circle r="5.5"/><circle r="5.5" cx="16"/><circle r="5.5" cx="32"/>
  </g>
  <text class="title-bar" x="400" y="18" text-anchor="middle">keynowawa — zsh — 80x24</text>
  
  <!-- Scanline effect -->
  <rect class="scanline" width="800" height="30" clip-path="url(#termClip)"/>
  
  <g class="glitch">
    <!-- Line 1 -->
    <g class="l1">
      <text x="20" y="55">
        <tspan class="prompt">~/projects </tspan>
        <tspan class="cmd">whoami</tspan>
      </text>
    </g>
    
    <!-- Line 2 -->
    <g class="l2">
      <text x="20" y="80">
        <tspan class="out">keynowawa · cs · </tspan>
        <tspan class="highlight">builds things when stressed</tspan>
      </text>
    </g>
    
    <!-- Line 3 -->
    <g class="l3">
      <text x="20" y="105">
        <tspan class="out">latest: </tspan>
        <tspan class="highlight">bubblewrap</tspan>
        <tspan class="out"> — force touch haptic bubble wrap for macOS</tspan>
      </text>
      <text x="20" y="125">
        <tspan class="prompt">~/projects </tspan>
        <tspan class="cursor">▌</tspan>
      </text>
    </g>
  </g>
</svg>
